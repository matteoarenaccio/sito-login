<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <!-- Card Profilo Utente -->
                <div class="card glass-form text-white shadow-lg p-3">
                    <div class="card-body text-center">
                        <h3 class="card-title mb-3 text-dark">Profilo Utente</h3>
                        <hr class="border-2">

                        <p class="card-text text-dark"><strong>Nome:</strong> <span id="infoNome">-</span></p>
                        <p class="card-text text-dark"><strong>Cognome:</strong> <span id="infoCognome">-</span></p>
                        <p class="card-text text-dark"><strong>Email:</strong> <span id="infoEmail">-</span></p>

                        <button id="btnLogout" class="btn btn-danger mt-3">Logout</button>
                    </div>
                </div>

            </div>
        </div>
    </div>



    <script src="js/dashboard.js" defer></script>
</body>

</html>
