<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <title>Sito Prova</title>
</head>

<body class="bg">
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent" data-aos="fade-down">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-dark" href="index.html">
                <i class="fa-solid fa-code me-1"></i>
            </a>

            <button class="navbar-toggler bg-dark" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar"
                aria-controls="menuNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavbar">
                <ul class="navbar-nav text-center">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link text-white active fw-bold">
                            <i class="fa-solid fa-house me-1"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#servizi" class="nav-link text-white">
                            <i class="fa-solid fa-layer-group me-1"></i> Servizi
                        </a>
                    </li>
                </ul>


                <div class="ms-auto text-center mt-3 mt-lg-0" id="authButtons">
                    <a href="login.html" class="btn btn-light me-2">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Accedi
                    </a>
                </div>
            </div>
        </div>
    </nav>



    <div class="container my-4">
        <div class="row justify-content-center">

            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <form id="registerForm" class="glass-form p-4 rounded w-100">

                    <div class="text-center">
                        <h4 class="fw-bold m-0">REGISTRATI</h4>
                    </div>

                    <hr class="my-3 border-2">

                    <div class="row g-2">
                        <div class="col-12 col-md-6 text-start">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" id="nome" name="nome" class="form-control" placeholder="Nome" required>
                        </div>
                        <div class="col-12 col-md-6 text-start">
                            <label for="cognome" class="form-label">Cognome</label>
                            <input type="text" name="cognome" id="cognome" class="form-control" placeholder="Cognome" required>
                        </div>
                    </div>

                    <div class="text-start mt-3">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="example@gmail.com" required />
                        <div id="messaggioErrore" class="text-danger small mt-1"></div>
                    </div>

                    <div class="text-start mt-3">
                        <label class="form-label" for="password">Password</label>
                        <div class="password-wrapper position-relative">
                            <input type="password" id="password" name="password" class="form-control pe-5" placeholder="Password" required />
                            <i class="fa-solid fa-eye position-absolute top-50 end-0 translate-middle-y me-3" id="toggleIcon" onclick="togglePassword()" style="cursor: pointer;"></i>
                        </div>
                        <div id="messaggioErrorePass" class="text-danger small mt-1"></div>
                    </div>
                    
                    <div class="fontPass mt-2 text-start small">
                        <ul class="ps-3 mb-0">
                            <li class="liPass">8 Caratteri</li>
                            <li class="liPass">1 Carattere speciale: ! , . ; $</li>
                            <li class="liPass">1 Carattere Maiuscolo</li>
                            <li class="liPass">1 Numero</li>
                        </ul>        
                    </div>

                    <!-- Pulsante Invia -->
                    <div class="mt-4 text-center">
                        <button class="btn btn-light w-100 fw-bold" type="submit" id="btnSubmit">Registrati</button>
                    </div>

                    <hr class="my-3 border-2">

                    <div class="text-center">
                        <span class="small">Hai già un account? <a class="text-dark fw-bold" href="login.html">Accedi</a></span>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
