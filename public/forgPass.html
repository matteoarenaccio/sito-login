<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recupera Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <form id="forgotForm" class="glass-form p-4 rounded text-white">
                    <h3 class="fw-bold text-center mb-3 text-dark">Password dimenticata?</h3>
                    <i><p class="small text-center mb-4">Inserisci la tua email. Ti invieremo un link per impostare una nuova password.</p></i>                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Indirizzo Email</label>
                        <input type="email" id="email" class="form-control" placeholder="nome@esempio.com" required>
                    </div>

                    <button type="submit" id="btnSubmit" class="btn btn-light w-100 fw-bold">
                        Invia Link
                    </button>

                    <!-- Alert di feedback -->
                    <div id="feedbackMessage" class="mt-3 text-center small d-none"></div>

                    <div class="text-center mt-3">
                        <a href="login.html" class="text-white small">Torna al Login</a>
                    </div>
                </form>
                <div id="statusMessage"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/forgPass.js"></script>
</body>
</html>
