<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Sito Prova</title>
</head>

<body class="bg">
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent" data-aos="fade-down">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-dark" href="index.html">
                <i class="fa-solid fa-code me-1"></i>
            </a>

            <button class="navbar-toggler bg-dark" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar"
                aria-controls="menuNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavbar">
                <ul class="navbar-nav text-center">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link text-white active fw-bold">
                            <i class="fa-solid fa-house me-1"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#servizi" class="nav-link text-white">
                            <i class="fa-solid fa-layer-group me-1"></i> Servizi
                        </a>
                    </li>
                </ul>


                <div class="ms-auto text-center mt-3 mt-lg-0" id="authButtons">
                    <a href="register.html" class="btn btn-light fw-bold">
                        <i class="fa-solid fa-user-plus me-1"></i> Registrati
                    </a>
                </div>
            </div>
        </div>
    </nav>



<div class="container my-4">
        <div class="row justify-content-center">

            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <form id="loginForm" class="glass-form p-4 rounded w-100">

                    <div class="text-start mt-3">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="example@gmail.com" required />
                        <div id="messaggioErrore" class="text-danger small mt-1"></div>
                    </div>

                    <div class="text-start mt-3">
                        <label class="form-label" for="password">Password</label>
                        <div class="password-wrapper position-relative">
                            <input type="password" id="password" name="password" class="form-control pe-5" placeholder="Password" required />
                            <i class="fa-solid fa-eye position-absolute top-50 end-0 translate-middle-y me-3" id="toggleIcon" onclick="togglePassword()" style="cursor: pointer;"></i>
                        </div>
                        <div class="mt-1">
                            <i><span class="mt-1"><a href="forgPass.html" class="text-dark">Password dimenticata?</a></span></i>
                        </div>
                        <div id="messErroreLogin" class="text-danger small mt-1"></div>
                    </div>
                    

                    <div class="mt-4 text-center">
                        <button class="btn btn-light w-100 fw-bold" type="submit">Accedi</button>
                    </div>

                    <hr class="my-3 border-2">

                    <div class="text-center">
                        <span class="small">Non hai un account? <a class="text-dark fw-bold" href="register.html">Registrati</a></span>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
