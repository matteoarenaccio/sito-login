<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Nuova Password</title>
</head>
<body>
    <h2>Inserisci la nuova password</h2>
    <form id="reset-form">
        <input type="password" id="new-password" placeholder="Nuova password" required minlength="6" />
        <button type="submit">Salva nuova password</button>
    </form>

    <!-- SDK Client di Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="reset-password.js"></script>
</body>
</html>
